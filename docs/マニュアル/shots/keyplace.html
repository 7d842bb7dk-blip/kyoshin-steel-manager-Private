<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>keyplace</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:900px;height:640px;overflow:hidden;font-family:"Yu Gothic UI","Meiryo",sans-serif;
    background:linear-gradient(175deg,#efece6 0%,#e6e2db 70%,#dcd8d0 100%);position:relative}
  /* 巾木（壁の下端） */
  .base{position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(#cfc9bf,#b9b2a6)}
  /* ドア枠の気配（右端） */
  .doorline{position:absolute;right:64px;top:0;bottom:46px;width:14px;background:linear-gradient(90deg,#d8d3ca,#c4beb2)}

  /* 貼り紙（アプリで印刷する実物と同じ構成） */
  .poster{position:absolute;left:120px;top:150px;width:400px;background:#fff;border-radius:10px;
    box-shadow:0 10px 26px rgba(60,50,30,.28);padding:22px;display:flex;gap:18px;align-items:center;transform:rotate(-1deg)}
  .poster svg{width:150px;height:150px;flex:0 0 auto}
  .pt .t{font-size:26px;font-weight:800;color:#15171c;letter-spacing:.02em}
  .pt .s{font-size:16.5px;color:#444;margin-top:8px;line-height:1.55}
  .pt .tag{display:inline-block;margin-top:12px;font-family:Consolas,monospace;font-size:13px;font-weight:700;
    color:#df1f26;border:2px solid #df1f26;border-radius:20px;padding:2px 14px;letter-spacing:.15em}
  /* テープ */
  .tape{position:absolute;width:74px;height:26px;background:rgba(255,240,180,.65);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .tape.tl{left:100px;top:136px;transform:rotate(-24deg)}
  .tape.tr{left:466px;top:128px;transform:rotate(18deg)}

  /* フックと鍵 */
  .hookplate{position:absolute;left:640px;top:180px;width:120px;height:170px;background:linear-gradient(#f7f5f1,#e9e6df);
    border:1px solid #cfc9bd;border-radius:12px;box-shadow:0 6px 16px rgba(60,50,30,.18)}
  .hookplate .lab{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:15px;font-weight:800;color:#5d5648}
</style>
</head>
