<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>stage</title>
<link rel="stylesheet" href="styles.css">
<style>*{animation:none!important;transition:none!important}::-webkit-scrollbar{display:none}html{scrollbar-width:none}</style>
</head>
<body>
<div class="strip"></div>
<header class="header">
  <div class="brandwrap"><img class="brandlogo" src="logo.png" alt="Kyo-shin"></div>
  <div class="hdr-right">
    <button class="admin-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg><span id="langLabel">Tiếng Việt</span></button>
  </div>
</header>
<nav class="tabs"></nav>
<main class="content">
  <section class="view active">
    <button class="scan-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
      <span class="scan-t">QRを読み取る</span>
      <span class="scan-s">材料のラベルを撮影してください</span>
    </button>
    <div class="panel" style="height:300px"></div>
  </section>
</main>

<div class="overlay show" id="keyOverlay">
  <div class="modal key-modal">
    <div class="modal-h">
      <h3><svg class="sec-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2M15 8l3 3M18 5l3 3"/></svg>鋼材倉庫の鍵</h3>
      <button class="x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="co-body">
      <div class="key-status">これから鋼材倉庫へ行くことを記録します</div>
      <label class="co-lab"><span>あなたの名前</span><span class="req">*</span>
        <select class="co-input"><option selected>山田　太郎</option></select>
      </label>
      <div class="key-btns">
        <button class="key-btn out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg><span>記録して倉庫へ行く</span></button>
      </div>
      <div class="key-note">倉庫で材料を使ったら、材料のQRを読んで<b>残りの長さの登録</b>を。鍵は使い終わったらフックに戻すだけでOK（返却の操作はありません）。</div>
    </div>
  </div>
</div>
</body>
</html>
